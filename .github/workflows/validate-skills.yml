name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guardian:
    name: Guardian Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Guardian
        run: npm run validate

      - name: Run Guardian (strict)
        run: npm run validate:strict
